<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vegas Companion</title>
  <meta name="description" content="Offline Las Vegas trip companion: bankroll tracker, tipping calculator, Strip walk times, and a comp estimator. Works with no internet." />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0e1a" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="topbar">
    <h1><span class="brand">Vegas Companion</span></h1>
  </div>
  <main>
    <noscript><p class="disclaimer">This app needs JavaScript to run. Reminder: gamble responsibly, only with money you can afford to lose. Problem gambling? Call 1-800-522-4700.</p></noscript>
    <p class="lead">Four little tools for a Vegas trip — track your bankroll, tip without guessing, gauge Strip walks, and estimate your comps. Everything runs on your phone, fully offline. Nothing you enter ever leaves this device.</p>
    <div class="grid" id="grid"></div>
    <div class="hub-actions">
      <button class="btn danger" id="reset-all">Clear all saved data</button>
    </div>
  </main>
  <script type="module" src="js/hub.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
